name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
- name: Generate android folder separately
        run: |
          flutter create --platforms=android --org com.cheragh scaffold_temp
          cp -r scaffold_temp/android ./android
          rm -rf scaffold_temp

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: cheragh-apk
          path: build/app/outputs/flutter-apk/app-release.apk

