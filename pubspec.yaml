name: cheragh
description: اپلیکیشن هیئت باب‌الحوائج زمان‌آباد
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI و فونت
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

  # مدیریت وضعیت و مسیریابی
  provider: ^6.1.2
  go_router: ^14.2.7

  # تاریخ و زمان
  intl: ^0.19.0
  shamsi_date: ^1.1.1

  # ذخیره‌سازی محلی (Mock Data و بعداً کش)
  shared_preferences: ^2.3.2

  # تصاویر و لینک
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
